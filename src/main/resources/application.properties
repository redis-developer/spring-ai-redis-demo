spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.embedding.options.model=bge-m3:latest
spring.ai.ollama.chat.options.model=qwen2.5:0.5b
spring.ai.ollama.connection-timeout=60s
spring.ai.ollama.read-timeout=60s
# Boot 4.2 起 OllamaApi 内部的 RestClient 默认工厂变为 Reactor Netty，附带约 10s 读超时，
# 会打断启动时的批量 embedding（本地 bge-m3 实测 40 段文本需 46.8s），这里显式放宽。
spring.ai.ollama.embedding.connect-timeout=10s
spring.ai.ollama.embedding.read-timeout=300s
logging.level.com.redis.demo.spring.ai=DEBUG
logging.level.org.springframework.ai=DEBUG

# Spring MVC 异步请求超时（毫秒）。/chat/{chatId} 返回 CompletableFuture，
# 不设这一项时沿用 Tomcat 默认的 30s，检索+生成一旦超过 30s 就会被抛
# AsyncRequestTimeoutException，对外表现为 503 Service Unavailable。
# 必须大于 RagController 里的 orTimeout(65s)，让业务超时先命中、返回可读错误信息。
spring.mvc.async.request-timeout=90000

# Chat Model 提供者配置 (ollama / openai)
# 默认使用 ollama
chat.provider=openai

# OpenAI 配置（当 chat.provider=openai 时生效）
# API Key 优先从环境变量 SILICONFLOW_KEY 获取，也可在此配置
spring.ai.openai.api-key=${SILICONFLOW_KEY:}
spring.ai.openai.chat.model=Qwen/Qwen3-8B
spring.ai.openai.chat.options.model=Qwen/Qwen3-8B
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.chat.options.temperature=0.7
spring.ai.vectorstore.pinecone.dimension=1024
spring.ai.vectorstore.pinecone.index-name=paper_collection_vpdf



spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.chat.observations.include-error-logging=true
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
spring.ai.vectorstore.observations.log-query-response=true

# ==================== ?????????? observations? ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers

# ==================== Prometheus ?? ====================
# Boot 4.x 属性键：management.prometheus.metrics.export.enabled
# （旧的 management.metrics.export.prometheus.enabled 已废弃，需在 Actuator 启动时实际验证）
management.prometheus.metrics.export.enabled=true

# ==================== ???? ====================
management.metrics.tags.application=spring-ai-rag-demo

# ==================== ???????P95/P99? ====================
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==================== ?????? tracing? ====================
management.tracing.sampling.probability=1.0

# SSL configuration to handle certificate issues
javax.net.ssl.trustStore=
javax.net.ssl.trustStorePassword=
javax.net.ssl.trustStoreType=

# Disable SSL certificate validation (for development only)
permissive.ssl=true

# Milvus éç½®
spring.ai.vectorstore.milvus.client.host=192.168.0.218
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.collection-name=paper_collection_vpdf
spring.ai.vectorstore.milvus.database-name=default
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=IP
spring.ai.vectorstore.milvus.consistency-level=STRONG
spring.ai.vectorstore.milvus.embeddingDimension=1024

# 召回阶段的 topK 值（增大以获取更多候选文档供 rerank 精排）
topk=10

# Rerank 精排配置 (使用硅基流动 SiliconFlow API)
# API Key 优先从环境变量 SILICONFLOW_KEY 获取，也可在此配置
# siliconflow.api-key=your-api-key-here
rerank.enabled=true
rerank.model=BAAI/bge-reranker-v2-m3
rerank.topN=5

# 学术论文分块配置 (Academic Paper Chunking Configuration)
# 针对论文场景优化的参数，适合长段落和结构化内容
chunking.defaultChunkSize=1000
chunking.minChunkSizeChars=400
chunking.minChunkLengthToEmbed=5
chunking.maxNumChunks=10000
chunking.keepSeparator=true

# 切块算法配置 (markdown: 自定义Markdown切块, token: TokenTextSplitter)
# 默认使用 markdown 算法，基于 Markdown 语义结构进行分块
chunking.algorithm=markdown

# MarkdownProcessor 自定义切块参数
# chunkTokenNum: 每个分块的真实 token 上限（jtokkit CL100K_BASE 计数）。
# 必须显著小于 TokenCountBatchingStrategy 的默认阈值 8191*(1-0.1)=7372，
# 否则 vectorStore.add 会在向量化前直接抛 IllegalArgumentException。
# delimiter: 切块时优先落点的句子/块边界字符集；这里必须用 \uXXXX 转义写中文标点，
# 因为 .properties 以 ISO-8859-1 读取，直接写中文会变成乱码。
# separateTables: 是否将表格单独分块
chunking.markdown.chunkTokenNum=800
chunking.markdown.delimiter=\n!?;\u3002\uFF1B\uFF01\uFF1F
chunking.markdown.separateTables=true

# DeepSeek-OCR PDF 文档识别配置
# API Key 从环境变量 SILICONFLOW_KEY 获取
deepseek-ocr.enabled=true
deepseek-ocr.model=deepseek-ai/DeepSeek-OCR

# 混合检索配置 (Lucene BM25 + Milvus Vector)
# 结合 BM25 全文检索和语义向量检索
hybrid.search.enabled=true
hybrid.search.collection-name=paper_collection_vpdf
hybrid.search.rrf.k=60
hybrid.search.dense.weight=0.7
hybrid.search.sparse.weight=0.3

# Redis Cloud 配置 (用于 BM25 索引持久化)
# 配置后 BM25 索引将持久化到 Redis，应用重启后自动恢复
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false