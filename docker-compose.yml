version: '3.8'

services:
  # ==================== Milvus 单机版依赖 ====================
  # 元数据存储
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 对象存储（9000 = S3 API，9001 = 控制台）
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 单机版（19530 = gRPC，9091 = metrics）
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.7
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ==================== BM25 索引持久化 ====================
  redis:
    image: redis/redis-stack-server
    hostname: redis

  # ==================== 应用 ====================
  spring:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - standalone
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    environment:
      - SPRING_AI_VECTORSTORE_REDIS_URI=redis://redis:6379
      # RagConfiguration.milvusServiceClient 只读取 host，端口在代码内固定为 19530。
      # 容器网络内用服务名 standalone；改用外部 Milvus 时设置 MILVUS_HOST 覆盖。
      - SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST=${MILVUS_HOST:-standalone}
      - SPRING_AI_AZURE_OPENAI_API_KEY=${SPRING_AI_AZURE_OPENAI_API_KEY}
      - SPRING_AI_AZURE_OPENAI_CHAT_OPTIONS_MODEL=${SPRING_AI_AZURE_OPENAI_CHAT_OPTIONS_MODEL}
      - SPRING_AI_AZURE_OPENAI_ENDPOINT=${SPRING_AI_AZURE_OPENAI_ENDPOINT}
